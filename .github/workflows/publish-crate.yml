name: publish-crate

# Publishes `globazog` to crates.io when release-please creates a `v*` tag on
# merge of the Release PR. The tag is created using the RELEASE_PLEASE_TOKEN PAT
# (not GITHUB_TOKEN), so this `push: tags` event fires normally.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret with publish rights
# (owner to set before the first release).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Guard against a manual or mistyped tag publishing an unintended version:
      # the `v*` tag must name the crate's own version, or we refuse to publish.
      - name: Verify tag matches crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "globazog") | .version')"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crate version ${expected}" >&2
            exit 1
          fi
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p globazog --locked
