# Copyright (c) 2026 Mike Grier

[workspace]
members = ["crates/globazog"]
resolver = "2"

[workspace.package]
version       = "0.1.0" # x-release-please-version
authors       = ["Mike Grier"]
edition       = "2021"
rust-version  = "1.85"
license       = "MIT"
repository    = "https://github.com/MikeGrier/globbinobulous-rs"
homepage      = "https://github.com/MikeGrier/globbinobulous-rs"
documentation = "https://docs.rs/globazog"

[workspace.dependencies]

# Release profile: tuned for shipped binary size.
#
# - `strip = "symbols"` removes debug symbols; typically halves a Rust Windows binary.
# - `lto = "thin"` enables cross-crate inlining/dead-code elimination at link time.
# - `codegen-units = 1` lets LLVM see the whole crate at once for better optimisation.
[profile.release]
strip         = "symbols"
lto           = "thin"
codegen-units = 1
